name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'

jobs:
  # Stage 1: Unit tests and production build (all events)
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --run

      - name: Build production bundle
        run: npm run build

      - name: Check build artifacts
        run: |
          for file in index.html sw.js CNAME robots.txt; do
            if [ ! -f "dist/$file" ]; then
              echo "Build failed: dist/$file not found"
              exit 1
            fi
          done
          echo "✓ Build successful"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # Stage 2: Deploy to GitHub Pages (main branch only, after unit tests and build pass)
  deploy:
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Never cancel a deployment in progress; queue the next one instead
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment notification
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to [gears.slurm.it](https://gears.slurm.it)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY

  # Stage 3: E2E tests (all events). Informational until the pre-existing
  # failures on main are fixed, so they don't block deploys.
  e2e-tests:
    runs-on: ubuntu-latest

    needs: build

    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build for testing
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 15

      - name: Upload E2E test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-report
          path: playwright-report/

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/

  # Stage 4: PWA quality (main branch pushes only, informational)
  pwa-quality:
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    needs: build

    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'
          runs: 1
