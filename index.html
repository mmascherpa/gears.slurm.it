<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: blob:;
                   connect-src 'self';
                   worker-src 'self' blob:;
                   font-src 'self' data:;
                   object-src 'none';
                   base-uri 'self';
                   form-action 'self';">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#73877B">
    <meta name="description" content="Privacy-focused browser tools for encoding, encryption, and file utilities. 100% client-side, works offline.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Slurm Tools - Privacy-Focused Browser Utilities">
    <meta property="og:description" content="Free, privacy-focused tools for Base64 encoding, QR codes, file encryption, password generation, and more. Everything runs in your browser - no data ever leaves your device.">
    <meta property="og:image" content="/icons/icon-512x512.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Slurm Tools - Privacy-Focused Browser Utilities">
    <meta name="twitter:description" content="Free, privacy-focused tools for encoding, encryption, and file utilities. 100% client-side, works offline.">
    <meta name="twitter:image" content="/icons/icon-512x512.png">

    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="manifest" href="/manifest.json">
    <title>Slurm Tools</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
